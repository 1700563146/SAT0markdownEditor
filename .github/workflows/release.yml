name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  # T-10：PR 上跑质量门禁（analyze + test），任一失败即阻断合并
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  # T-10：质量门禁 —— analyze/test 任一失败即 job 失败，阻断 PR 合并
  quality-gate:
    name: Quality Gate (analyze & test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze (fatal-infos off)
        run: flutter analyze --fatal-infos=false

      - name: Flutter test
        run: flutter test

  build-and-release:
    needs: quality-gate
    runs-on: ubuntu-latest
    # T-10：仅在 tag push 时构建发布（PR 只跑质量门禁）
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/milkdown/package-lock.json

      - name: Build Milkdown web bundle
        working-directory: web/milkdown
        run: |
          npm ci
          npm run build

      - name: Sync Milkdown runtime artifact
        run: cp web/milkdown/dist/index.html assets/milkdown_web/index.html

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter clean
        run: flutter clean

      - name: Flutter pub get
        run: flutter pub get

      # T-10：正式签名 —— keystore 与密钥全部来自仓库 secrets，不入库；secrets 缺失直接失败，禁止静默发布 debug 签名产物
      - name: Configure release signing (secrets -> keystore & key.properties)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing Android signing secrets (ANDROID_KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD). Refusing to build a debug-signed/unsigned release."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          echo "Signing config written (android/app/upload-keystore.jks + android/key.properties)"

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Rename APKs with custom naming
        run: |
          VERSION=${{ steps.get_version.outputs.VERSION }}
          cd build/app/outputs/flutter-apk
          
          # Rename APKs to ushio-md-v{version}-{abi}.apk format
          if [ -f "app-armeabi-v7a-release.apk" ]; then
            mv app-armeabi-v7a-release.apk ushio-md-v${VERSION}-armeabi-v7a.apk
          fi
          if [ -f "app-arm64-v8a-release.apk" ]; then
            mv app-arm64-v8a-release.apk ushio-md-v${VERSION}-arm64-v8a.apk
          fi
          if [ -f "app-x86_64-release.apk" ]; then
            mv app-x86_64-release.apk ushio-md-v${VERSION}-x86_64.apk
          fi
          
          echo "Renamed APKs:"
          ls -la *.apk

      - name: Generate SHA-256 checksums
        working-directory: build/app/outputs/flutter-apk
        run: |
          sha256sum *.apk > checksums.txt
          cat checksums.txt

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            # First release, get all commits
            COMMITS=$(git log --pretty=format:"- %s (%h)" --reverse)
          else
            # Get commits since last tag
            COMMITS=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" --reverse)
          fi
          
          # Save changelog to file for multiline output
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: 沢 v${{ steps.get_version.outputs.VERSION }}
          body: |
            ## 🎉 沢 (Ushio) v${{ steps.get_version.outputs.VERSION }}
            
            ### 📝 更新内容
            
            ${{ steps.changelog.outputs.CHANGELOG }}
            
            ### 📦 下载说明
            
            请根据您的设备架构选择对应的 APK 文件：
            - `ushio-md-v${{ steps.get_version.outputs.VERSION }}-armeabi-v7a.apk` - 适用于大多数 32 位设备
            - `ushio-md-v${{ steps.get_version.outputs.VERSION }}-arm64-v8a.apk` - 适用于 64 位设备（推荐）
            - `ushio-md-v${{ steps.get_version.outputs.VERSION }}-x86_64.apk` - 适用于 x86 模拟器
            
            ### 🔒 完整性校验

            `checksums.txt` 包含所有 APK 的 SHA-256 校验值；应用内更新会在安装前自动校验文件完整性与签名。

            ### 💡 安装提示

            1. 下载对应架构的 APK 文件
            2. 允许安装未知来源应用
            3. 安装并授予文件访问权限

            ---

            [完整更新日志](https://github.com/jiuxina/ushio-md/blob/main/CHANGELOG.md)
          files: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/flutter-apk/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
